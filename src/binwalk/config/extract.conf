#######################################################################################################################################
# Default extraction rules, loaded when --extract is specified.
#
# THIS BUILD EXTRACTS THROUGH 7-ZIP (the "7-Zip" folder inside the binwalk folder).
# No other external tool (gzip, tar, unsquashfs, jefferson, ...) is ever invoked.
#
# Exception: formats that the ORIGINAL binwalk already extracted with the python standard library or its
# own code are still extracted that way, by plugins that run BEFORE these rules:
#   gzip, xz, lzma, zlib, raw deflate (-X), raw LZMA (-Z), Arcadyan, D-Link ROMFS, PFS, Windows CE.
# For gzip / xz / lzma the rules below are the fallback if the python extractor fails.
#
# File types with neither a 7-Zip rule nor a python extractor are skipped
# (not carved, no output directory, no warning) when --extract is used.
#
# <lower-case unique string from binwalk output text>:<desired file extension>:<command to execute>:<successful command return codes>:<False to not scan extracted files/directories>
#
# Note that:
#   %7z   is a place holder for the full path of the bundled 7-Zip command line executable (7z.exe).
#         (It is a place holder because a Windows path such as C:\... contains a colon, which is the rule delimiter.)
#   %e    is a place holder for the extracted (carved) file name.
#   %%    is used when a unique file path is required.
#         For example '%%squashfs-root%%' will be replaced with 'squashfs-root-0' if 'squashfs-root' already exists.
#
# 7-Zip exit codes: 0 = OK, 1 = warning (non fatal, e.g. trailing data after the end of an archive), 2 = fatal error.
# Warnings are accepted as success because carved data frequently contains trailing bytes.
#
# Windows quoting rules apply: use double quotes only (single quotes are not special to Windows).
#
# NOT extracted (no 7-Zip handler, no python extractor):
#   lzo/lzop, lz4, lzip, rzip/lrzip, snappy, StuffIt, InstallShield CAB, jffs2, ubi/ubifs, yaffs, romfs, minix,
#   QNX, vmware3 disk, Motorola S-Record, Hilink (needs pycrypto), PGP (needs gnupg), ...
#
#######################################################################################################################################

# ---- Single stream compressors (decompressed file is written next to the carved file) ----
^gzip compressed data:gz:%7z x -y "%e":0,1
^lzma compressed data:lzma:%7z x -y "%e":0,1
^xz compressed data:xz:%7z x -y "%e":0,1
^bzip2 compressed data:bz2:%7z x -y "%e":0,1
^compress'd data:Z:%7z x -y "%e":0,1

# ---- Archives ----
^7-zip archive data:7z:%7z x -y -o"%%7z-root%%" "%e":0,1
^posix tar archive:tar:%7z x -y -o"%%tar-root%%" "%e":0,1
^rar archive data:rar:%7z x -y -o"%%rar-root%%" "%e":0,1
^arj archive data.*comment header:arj:%7z x -y -o"%%arj-root%%" "%e":0,1
^lha:lzh:%7z x -y -o"%%lha-root%%" "%e":0,1
^microsoft cabinet archive:cab:%7z x -y -o"%%cab-root%%" "%e":0,1
^xar archive:xar:%7z x -y -o"%%xar-root%%" "%e":0,1
^rpm:rpm:%7z x -y -o"%%rpm-root%%" "%e":0,1
^osx dmg:dmg:%7z x -y -o"%%dmg-root%%" "%e":0,1
^iso 9660:iso:%7z x -y -o"%%iso-root%%" "%e":0,1

# The cpio rule is executed once per archive (see plugins/cpio.py).
^ascii cpio archive:cpio:%7z x -y -o"%%cpio-root%%" "%e":0,1:False

# The zip rule is executed only once per archive (see plugins/ziphelper.py).
^zip archive data:zip:%7z x -y -o"%%zip-root%%" "%e":0,1

# ---- Intel HEX -> binary ----
^intel hex:ihex:%7z x -y "%e":0,1

# ---- File systems / disk images (extracted contents are not scanned recursively) ----
^squashfs filesystem:squashfs:%7z x -y -o"%%squashfs-root%%" "%e":0,1:False
^cramfs filesystem:cramfs:%7z x -y -o"%%cramfs-root%%" "%e":0,1:False
^linux ext filesystem:ext:%7z x -y -o"%%ext-root%%" "%e":0,1:False
^qemu qcow image:qcow2:%7z x -y -o"%%qcow-root%%" "%e":0,1:False
^vmware4 disk image:vmdk:%7z x -y -o"%%vmdk-root%%" "%e":0,1:False
